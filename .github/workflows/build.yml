name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build so
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Build dex
        run: |
          SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          JAR=$(ls $SDK/platforms/*/android.jar | sort -V | tail -1)
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          mkdir -p out dexout dist
          javac --release 8 -cp $JAR -d out $(find java -name '*.java')
          $BT/d8 --release --min-api 21 --lib $JAR --output dexout $(find out -name '*.class')
          cp build/libgglua.so dist/
          cp dexout/classes.dex dist/gglua.dex
      - uses: actions/upload-artifact@v4
        with:
          name: gglua
          path: dist/
